spring.application.name=tax-reporter
server.port=6060

# =========================
# POSTGRESQL (JPA PRIMARY)
# =========================
spring.datasource.postgres.jdbc-url=${SP_DB_URL:jdbc:postgresql://localhost:4531/tax_reporter}
spring.datasource.postgres.username=${SP_DB_USERNAME:postgres}
spring.datasource.postgres.password=${SP_DB_PASSWORD}
spring.datasource.postgres.driver-class-name=org.postgresql.Driver
# Schema is owned by Flyway; Hibernate only CHECKS that it matches the entities. If startup fails with
# "Schema-validation", fix it with a new V<n> migration. Emergency switch only: ddl-auto=none.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# ORACLE (JDBC ONLY)
# =========================
spring.datasource.oracle.jdbc-url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/magicash}
spring.datasource.oracle.username=${ORACLE_DB_USERNAME}
spring.datasource.oracle.password=${ORACLE_DB_PASSWORD}
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.oracle.hikari.maximum-pool-size=10
spring.datasource.oracle.hikari.minimum-idle=2
spring.datasource.oracle.hikari.connection-timeout=10000
spring.datasource.oracle.hikari.idle-timeout=600000
spring.datasource.oracle.hikari.max-lifetime=1700000
spring.datasource.oracle.hikari.keepalive-time=300000
spring.datasource.oracle.hikari.read-only=true

# =========================
# STAMP (SQL SERVER, secondary)
# =========================
spring.datasource.stamp.jdbc-url=${STAMP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StampDB;encrypt=true;trustServerCertificate=true}
spring.datasource.stamp.username=${STAMP_DB_USERNAME:sa}
spring.datasource.stamp.password=${STAMP_DB_PASSWORD}
spring.datasource.stamp.pool-name=StampDbPool
spring.datasource.stamp.maximum-pool-size=3
spring.datasource.stamp.minimum-idle=0
spring.datasource.stamp.connection-timeout=8000
spring.datasource.stamp.max-lifetime=1800000
spring.datasource.stamp.idle-timeout=30000
spring.datasource.stamp.read-only=true
spring.datasource.stamp.initialization-fail-timeout=-1

app.timezone=Africa/Kigali

# Credentials have NO fallback default on purpose: if a variable is missing from the service's
# EnvironmentFile the app refuses to start instead of silently using a placeholder.
# Background jobs. Staggered 2-3 minutes apart, in dependency order (pull -> match -> allocate ->
# stamp), so jobs that write the same tables don't overlap and the Oracle/Postgres/SQL Server pools
# aren't all hit at the same second. Each job also has its own re-entrancy guard: a slow run makes
# the next tick skip instead of piling up. "-" = never schedule (Spring's documented sentinel).
# Run ONE instance of the app with these enabled - the guards are per-JVM only.
cards.pull.cron.expression=0 0/10 * * * ?
deposit.pull.cron.expression=0 2/10 * * * ?
matching.mode.cron.expression=0 5/10 * * * ?
allocate.cron.expression=0 7/10 * * * ?
stamp.pull.cron.expression=0 9/20 * * * ?
# Maintenance back-fill re-pulls a fixed date range; keep OFF and run it from the Jobs page when needed.
cards.maintenance.cron.expression=-
deposit.maintenance.cron.expression=-
maintenace.start.date=01/06/2026
maintenace.end.date=04/07/2026
maintenace.mode.enabled=false

matching.mode.enabled=true
matching.back.days=0
# Unmatched card transactions are retried every matching run until this many days (1 = 24 hours) old, then marked processed.
matching.retry.days=1
# Card transactions dated before this day are never matched or retried (system stable from 11 June 2026)
matching.start.date=2026-06-11
# Scheduled stamp lookup gives up on a deposit after this many "not found" tries (72 x 20 min = ~1 day in sp).
stamp.lookup.max-attempts=72
