spring.application.name=tax-reporter
server.port=6060
server.servlet.context-path=/tax-reporter

# =========================
# POSTGRESQL (JPA PRIMARY)
# =========================
spring.datasource.postgres.jdbc-url=${DEV_DB_URL:jdbc:postgresql://localhost:5434/tax_reporter_card1}
spring.datasource.postgres.username=${DEV_DB_USERNAME:postgres}
spring.datasource.postgres.password=${DEV_DB_PASSWORD:npf2020.}
spring.datasource.postgres.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# ORACLE (JDBC ONLY)
# =========================
# The uploaded dev file had a trailing backslash on the Oracle password line — in .properties
# syntax that's a line-continuation character, which merged the NEXT line
# (driver-class-name=...) into the password property's value: the resulting password would
# have been garbled with the driver-class-name text appended to it, and driver-class-name
# would never have been set as its own property at all — both properties broken by one stray
# character. The oracle/sp profile versions of this same line don't have the backslash, so
# this looks like an accidental copy/paste artifact isolated to dev. Fixed here — no trailing
# backslash on the password line below.
spring.datasource.oracle.jdbc-url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/magicash}
spring.datasource.oracle.username=${ORACLE_DB_USERNAME:changeme}
spring.datasource.oracle.password=${ORACLE_DB_PASSWORD:changeme}
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.oracle.hikari.maximum-pool-size=10
spring.datasource.oracle.hikari.minimum-idle=2
spring.datasource.oracle.hikari.connection-timeout=10000
spring.datasource.oracle.hikari.idle-timeout=600000
spring.datasource.oracle.hikari.max-lifetime=1700000
spring.datasource.oracle.hikari.keepalive-time=300000
spring.datasource.oracle.hikari.read-only=true

# =========================
# STAMP (SQL SERVER, secondary)
# =========================
spring.datasource.stamp.jdbc-url=${STAMP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StampDB;encrypt=false;trustServerCertificate=true}
spring.datasource.stamp.username=${STAMP_DB_USERNAME:sa}
spring.datasource.stamp.password=${STAMP_DB_PASSWORD:changeme}
spring.datasource.stamp.pool-name=StampDbPool
spring.datasource.stamp.maximum-pool-size=3
spring.datasource.stamp.minimum-idle=0
spring.datasource.stamp.connection-timeout=8000
spring.datasource.stamp.max-lifetime=1800000
spring.datasource.stamp.idle-timeout=30000
spring.datasource.stamp.read-only=true
spring.datasource.stamp.initialization-fail-timeout=-1

app.timezone=Africa/Kigali

# Background jobs referenced by property name here (cards.pull.*, deposit.pull.*, stamp.pull.*,
# maintenace.*) don't correspond to any implemented job in this reference project — only
# allocate.cron.expression (CustomerDepositMatchingService) and matching.mode.* (PostgresJob)
# are real here. Kept as literal "-" (Spring's own documented sentinel meaning "never schedule
# this task" — a real, intentional value, not a placeholder needing replacement) so the
# property structure matches your real config exactly; harmless to leave present even where
# nothing reads them yet.
cards.pull.cron.expression=-
cards.maintenance.cron.expression=-
deposit.pull.cron.expression=-
deposit.maintenance.cron.expression=-
stamp.pull.cron.expression=0 0/03 * * * ?
allocate.cron.expression=-
maintenace.start.date=01/06/2026
maintenace.end.date=04/07/2026
maintenace.mode.enabled=true

matching.mode.enabled=true
matching.mode.cron.expression=-
matching.back.days=0
