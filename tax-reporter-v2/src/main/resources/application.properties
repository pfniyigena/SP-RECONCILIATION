# Resolved by Maven resource filtering at build time (see pom.xml <build><resources>) — the
# active Maven profile's <spring.profiles.active> property is substituted in here. Plain
# `mvn package` (no -Psp/-Poracle) resolves to "dev", the default set at the top level of
# pom.xml's <properties>. Building without filtering enabled would leave this literally as
# the text "@spring.profiles.active@", which Spring Boot would then fail to parse as a
# profile name at all.
spring.profiles.active=@spring.profiles.active@

# =========================
# POSTGRESQL (JPA PRIMARY)
# =========================
# Connection details (jdbc-url/username/password) are per-profile — see application-{profile}.
# Pool tuning here applies across every profile, matching your real base file.
spring.datasource.postgres.hikari.maximum-pool-size=20
spring.datasource.postgres.hikari.minimum-idle=5
spring.datasource.postgres.hikari.connection-timeout=30000
spring.datasource.postgres.hikari.idle-timeout=600000
spring.datasource.postgres.hikari.max-lifetime=1700000
spring.datasource.postgres.hikari.keepalive-time=300000
spring.datasource.postgres.hikari.validation-timeout=5000
spring.datasource.postgres.hikari.leak-detection-threshold=600000

# =========================
# ORACLE (JDBC ONLY)
# =========================
spring.datasource.oracle.hikari.maximum-pool-size=10
spring.datasource.oracle.hikari.minimum-idle=2
spring.datasource.oracle.hikari.connection-timeout=10000
spring.datasource.oracle.hikari.idle-timeout=600000
spring.datasource.oracle.hikari.max-lifetime=1700000
spring.datasource.oracle.hikari.keepalive-time=300000
spring.datasource.oracle.hikari.read-only=true

# =========================
# Hibernate Batch Inserts (Very Important)
# =========================
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# =========================
# SCHEDULING
# =========================
# Explicit pool size, not the 1-thread default — this app now has two independent @Scheduled
# jobs (CustomerDepositMatchingService, PostgresJob) that can legitimately want to run at
# overlapping times; without this they'd serialize behind Spring's single default scheduler
# thread regardless of each job's own reentrancy guard.
spring.task.scheduling.pool.size=4

# =========================
# LOGS
# =========================
# NOTE, not present in your original comments but worth flagging: this block applies to every
# profile, including sp — DEBUG-level SQL/bind-parameter/security logging in whatever profile
# ends up serving real traffic is a real log-volume and (for the bind-parameter logger
# specifically) potential data-exposure consideration, not just a verbosity one. Kept exactly
# as given since that's what your real base file does; worth a second look at whether this
# should be dev-only.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.web.reactive.function.client.WebClient=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
# Both restored now that the real pom.xml confirms spring-boot-starter-webflux is a genuine
# dependency (so WebClient/Reactor Netty logging isn't dead configuration) and logback-spring.xml
# now actually exists in this project — omitting this line earlier was specifically because
# referencing a nonexistent logback config file breaks startup, not just a no-op; that's no
# longer true.
logging.config=classpath:logback-spring.xml
logging.level.nika.tax.reporter=INFO
logging.level.org.springframework.security=DEBUG

# =========================
# THYMELEAF
# =========================
spring.thymeleaf.cache=false

# =========================
# Created automatically on first boot if no users exist yet — change this password
# immediately after first login.
# =========================
app.default-admin.username=admin
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:admin123}
