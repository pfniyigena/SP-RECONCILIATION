# "Test Profile" per the real pom.xml's own comment on this Maven profile. Active via:
# -Dspring.profiles.active=niwe (or SPRING_PROFILES_ACTIVE=niwe) at RUNTIME — building with
# `mvn package -Pniwe` alone does NOT activate this on its own; it only bakes "niwe" into
# application.properties' @spring.profiles.active@ placeholder and the jar's filename via
# Maven resource filtering (see pom.xml). The running app still needs to actually be started
# with that resolved profile name active, same as every other profile here.
#
# DO NOT put spring.profiles.default or spring.profiles.active in this file — Spring Boot
# rejects both inside any profile-specific file with InvalidConfigDataPropertyException at
# startup (a hard failure). A profile-specific file only loads AFTER a profile has already
# been selected, so it can't also be what does the selecting. spring.profiles.include IS
# allowed here if "niwe" needs another profile active alongside it.
#
# EMPTY PLACEHOLDER — this Maven profile was discovered from the real pom.xml, but no
# corresponding application-niwe.properties (or its real values) has been provided. Rather
# than invent settings that might be wrong, this file exists so the profile builds and loads
# cleanly with nothing in it yet. Add whatever "niwe" actually needs to configure — most
# likely the same shape as dev/sp/oracle (postgres/oracle/stamp datasource connection info,
# job cron expressions, etc.) once that's known.
