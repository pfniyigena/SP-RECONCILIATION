<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Access Denied — Tax Reporter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<th:block th:replace="~{fragments/styles :: base}"></th:block>
<style>
  body.denied-body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);
  }
  .denied-card{
    width:100%;max-width:420px;background:var(--paper-raised);
    border:1px solid var(--line);border-radius:4px;
    box-shadow:0 18px 40px -22px rgba(28,35,51,0.35);
    padding:36px 34px 30px;text-align:center;
  }
  .denied-glyph{font-family:'IBM Plex Mono',monospace;font-size:34px;color:var(--red);margin-bottom:14px;}
  .denied-card h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin:0 0 10px;color:var(--ink);}
  .denied-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 22px;}
</style>
</head>
<body class="denied-body">
  <div class="denied-card">
    <div class="denied-glyph">⛔</div>
    <h1>Access denied</h1>
    <p>Your account doesn't have permission to view this page. If you think this is a mistake, ask an administrator to check your role.</p>
    <a class="btn btn-primary" th:href="@{/transactions}">Back to Transactions</a>
  </div>
</body>
</html>
