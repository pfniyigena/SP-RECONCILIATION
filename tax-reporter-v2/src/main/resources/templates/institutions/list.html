<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Institutions — Tax Reporter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<th:block th:replace="~{fragments/styles :: base}"></th:block>
<th:block th:replace="~{fragments/crud-styles :: crud}"></th:block>
</head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/nav :: sidebar(active='institutions')}"></aside>

  <main class="main">
    <div class="crud-topbar">
      <div>
        <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0;">Institutions</h1>
        <span style="font-size:12.5px;color:var(--ink-soft);">Organizations that stamp machines and support tickets belong to</span>
      </div>
      <a class="btn btn-primary" th:href="@{/institutions/new}">+ New institution</a>
    </div>

    <div class="crud-flash" th:if="${flashMessage}" th:text="${flashMessage}">Institution created.</div>

    <form class="crud-search" method="get" th:action="@{/institutions}">
      <input type="text" name="q" placeholder="Search name or TIN…" th:value="${q}">
      <button type="submit" class="btn btn-ghost">Search</button>
      <a class="btn btn-ghost" th:if="${q}" th:href="@{/institutions}">Clear</a>
    </form>

    <div class="crud-count">
      <span th:text="${#numbers.formatInteger(institutions.totalElements, 0, 'COMMA')}">4</span> institution(s)
    </div>

    <div class="crud-table-wrap">
      <table class="crud-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>TIN number</th>
            <th>Status</th>
            <th class="crud-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="i : ${institutions.content}">
            <td th:text="${i.name ?: '—'}">Kigali Fuel Ltd</td>
            <td class="mono" th:text="${i.tinNumber ?: '—'}">123456789</td>
            <td>
              <span class="badge-enabled" th:if="${i.enabled == true}">Enabled</span>
              <span class="badge-disabled" th:if="${i.enabled != true}">Disabled</span>
            </td>
            <td class="crud-actions">
              <a class="edit-link" th:href="@{/institutions/{id}/edit(id=${i.id})}">Edit</a>
              <form th:action="@{/institutions/{id}/delete(id=${i.id})}" method="post" class="confirm-submit" style="display:inline;"
                    data-confirm="Delete this institution? This can't be undone.">
                <button type="submit" class="delete-link">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
        <tbody th:if="${institutions.numberOfElements == 0}">
          <tr>
            <td colspan="4">
              <div class="crud-empty">
                <div class="glyph">— · —</div>
                No institutions match this search.
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="crud-pagination" th:if="${institutions.totalPages > 1}">
      <span>Page <span th:text="${institutions.number + 1}">1</span> of <span th:text="${institutions.totalPages}">3</span></span>
      <div class="pages">
        <a class="page-link" th:classappend="${institutions.first} ? 'disabled'"
           th:href="@{/institutions(q=${q},page=${institutions.number - 1})}">‹</a>
        <a class="page-link" th:classappend="${institutions.last} ? 'disabled'"
           th:href="@{/institutions(q=${q},page=${institutions.number + 1})}">›</a>
      </div>
    </div>
  </main>
</div>

<script>
  // Delegated wiring — no inline onsubmit — so this page keeps working
  // regardless of any Content-Security-Policy the app might set.
  document.addEventListener('submit', (e) => {
    if (e.target.matches('.confirm-submit')) {
      if (!confirm(e.target.dataset.confirm || 'Are you sure?')) {
        e.preventDefault();
      }
    }
  });
</script>
</body>
</html>
