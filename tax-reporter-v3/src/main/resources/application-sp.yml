# Active via: -Dspring.profiles.active=sp (or SPRING_PROFILES_ACTIVE=sp) at RUNTIME.
# Building with `mvn package -Psp` alone does NOT activate this — same caveat as oracle
# (see application-oracle.yml's header, and pom.xml's <profiles> section).
#
# EMPTY PLACEHOLDER — unlike oracle (whose name at least implies "Oracle datasource"), I don't
